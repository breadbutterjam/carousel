<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Selection Screen -->
    <div id="selectionScreen" class="selection-screen">
        <div class="container">
            <div class="header">
                <h1>Image Gallery Viewer</h1>
                <p>Select an image collection to start browsing</p>
            </div>
            <!-- Cards are generated dynamically by script.js -->
            <div id="cardGrid" class="grid"></div>
        </div>
    </div>

    <!-- Image Viewer -->
    <div id="imageViewer" class="viewer hidden">

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="viewer-header">
            <div>
                <h2 id="viewerTitle">Collection</h2>
                <p id="viewerCounter">Image 1 of 5</p>
            </div>
            <button class="close-btn" onclick="exitViewer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            </button>
        </div>

        <div class="image-container">
            <img id="mainImage" src="" alt="Gallery Image">
        </div>

        <button class="nav-btn nav-prev" onclick="previousImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </button>

        <button class="nav-btn nav-next" onclick="nextImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        </button>

        <div id="navDots" class="nav-dots"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
